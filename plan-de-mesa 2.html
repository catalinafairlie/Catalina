<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Table · Plan de Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #b8975a;
    --gold-light: #d4b483;
    --dark: #1a1008;
    --text: #2c1a0a;
  }
  body {
    min-height: 100vh;
    background: #ffffff;
    font-family: 'Montserrat', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 60px;
    color: var(--text);
  }
  .deco-line { width:1px; height:60px; background:linear-gradient(to bottom,transparent,var(--gold)); margin-bottom:24px; }
  header { text-align:center; margin-bottom:40px; }
  .event-label { font-weight:200; font-size:10px; letter-spacing:6px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(28px,7vw,52px); letter-spacing:2px; color:var(--dark); line-height:1.15; margin-bottom:6px; }
  h1 .es { display:block; font-size:0.7em; color:#aaa; letter-spacing:3px; margin-top:4px; }
  .subtitle { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; color:var(--gold); font-weight:300; line-height:1.8; }
  .ornament { display:flex; align-items:center; gap:16px; margin:16px 0 32px; color:var(--gold); }
  .ornament-line { flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold-light)); max-width:80px; }
  .ornament-line.right { background:linear-gradient(to left,transparent,var(--gold-light)); }
  .search-wrapper { width:100%; max-width:480px; margin-bottom:8px; position:relative; }
  .search-wrapper input {
    width:100%; padding:18px 24px 18px 52px;
    background:#fff; border:1px solid rgba(184,151,90,0.4); border-radius:0;
    font-family:'Montserrat',sans-serif; font-size:14px; font-weight:300; letter-spacing:1px;
    color:var(--text); outline:none; transition:border-color 0.3s,box-shadow 0.3s;
    box-shadow:0 4px 30px rgba(184,151,90,0.06);
  }
  .search-wrapper input::placeholder { color:#bbb; letter-spacing:1px; }
  .search-wrapper input:focus { border-color:var(--gold); box-shadow:0 4px 40px rgba(184,151,90,0.14); }
  .search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--gold); font-size:16px; pointer-events:none; }
  .suggestions {
    width:100%; max-width:480px; background:#fff;
    border:1px solid rgba(184,151,90,0.3); border-top:none;
    box-shadow:0 8px 30px rgba(61,31,10,0.06); display:none; margin-bottom:16px;
  }
  .suggestions.open { display:block; }
  .suggestion-item {
    padding:12px 24px; font-size:13px; font-weight:300; letter-spacing:0.5px;
    cursor:pointer; transition:background 0.15s; color:var(--text);
    border-bottom:1px solid rgba(184,151,90,0.08);
  }
  .suggestion-item:last-child { border-bottom:none; }
  .suggestion-item:hover { background:rgba(184,151,90,0.06); }
  .suggestion-item em { font-style:normal; color:var(--gold); }
  .result { width:100%; max-width:600px; opacity:0; transform:translateY(20px); transition:opacity 0.5s ease,transform 0.5s ease; }
  .result.visible { opacity:1; transform:translateY(0); }
  .result-card {
    background:#fff; border:1px solid rgba(184,151,90,0.3);
    padding:32px 36px; text-align:center; position:relative;
    box-shadow:0 8px 40px rgba(61,31,10,0.06);
  }
  .result-card::before,.result-card::after {
    content:''; position:absolute; width:20px; height:20px;
    border-color:var(--gold); border-style:solid;
  }
  .result-card::before { top:8px; left:8px; border-width:1px 0 0 1px; }
  .result-card::after { bottom:8px; right:8px; border-width:0 1px 1px 0; }
  .result-name { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:400; color:var(--dark); margin-bottom:4px; }
  .result-greeting { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:#aaa; margin-bottom:20px; line-height:1.7; }
  .result-table-label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; font-weight:300; }
  .result-table-name { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; color:var(--dark); line-height:1.2; }
  .result-divider { width:40px; height:1px; background:var(--gold-light); margin:20px auto; }
  .companions-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:#bbb; margin-bottom:10px; font-weight:300; }
  .companions-list { font-family:'Cormorant Garamond',serif; font-size:14px; color:#999; line-height:2; font-style:italic; }
  .plan-section { margin-top:28px; border-top:1px solid rgba(184,151,90,0.2); padding-top:24px; }
  .plan-label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:14px; font-weight:300; }
  .plan-img { width:100%; display:block; border:1px solid rgba(184,151,90,0.15); }
  .not-found { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px; color:#bbb; text-align:center; padding:30px; line-height:1.8; }
  footer { margin-top:50px; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#ccc; font-weight:300; text-align:center; line-height:2; }
</style>
</head>
<body>
<div class="deco-line"></div>
<header>
  <div class="event-label">Plan de Table · Plan de Mesa</div>
  <h1>

    <span class="es">Tu lugar en la celebración</span>

  <p class="subtitle">

    <span style="color:#bbb;font-size:0.9em;">Bienvenido/a a nuestra boda</span>
  </p>
</header>
<div class="ornament">
  <div class="ornament-line"></div>
  <span>✦</span>

<div class="search-wrapper">

</div>
<div class="suggestions" id="suggestions"></div>

function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function findGuest(query) {
  const q = normalize(query.trim());
  if (!q) return null;
  for (const [k,v] of Object.entries(guests)) if (normalize(k)===q) return v;
  for (const [k,v] of Object.entries(guests)) if (normalize(k).startsWith(q)) return v;
  for (const [k,v] of Object.entries(guests)) if (normalize(k).includes(q)) return v;
  return null;
}
const allNames = Object.values(guests).map(g=>g.name);
function getSuggestions(query) {
  const q = normalize(query.trim());
  if (q.length < 2) return [];
  return allNames.filter(n=>normalize(n).includes(q)).slice(0,6);
}
function highlight(name,query) {
  const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return name.replace(new RegExp(`(${q})`,'gi'),'<em>$1</em>');
}
function showResult(guest) {
  const companions = tables[guest.table].filter(n=>normalize(n)!==normalize(guest.name));
  const el = document.getElementById('result');
  el.innerHTML = `
    <div class="result-card">
      <div class="result-name">${guest.name}</div>
      <div class="result-greeting">
        Nous sommes ravis de vous accueillir<br>
        <span style="color:#ccc;font-size:0.9em;">Nos alegra tenerte aquí</span>
      </div>
      <div class="result-table-label">Votre table · Su mesa</div>
      <div class="result-table-name">${guest.table}</div>
      <div class="result-divider"></div>
      <div class="companions-label">Vos voisins · Sus compañeros</div>
      <div class="companions-list">${companions.join(' · ')}</div>
      <div class="plan-section">
        <div class="plan-label">Plan de table complet · Plan de mesa completo</div>
        <img class="plan-img" src="${PLAN_IMG}" alt="Plan de table" />
      </div>
    </div>`;
  el.classList.remove('visible');
  void el.offsetWidth;
  el.classList.add('visible');
}
function showNotFound(query) {
  const el = document.getElementById('result');
  el.innerHTML = `<div class="not-found">
    Nous n'avons pas trouvé "<strong>${query}</strong>"<br>
    <span style="font-size:0.9em;">No encontramos "<strong>${query}</strong>" en el plan</span><br><br>
    <span style="font-size:0.85em;color:#ccc;">Veuillez consulter les organisateurs · Consulta con los organizadores</span>
  </div>`;
  el.classList.remove('visible');
  void el.offsetWidth;
  el.classList.add('visible');
}
const input = document.getElementById('searchInput');
const suggestionsEl = document.getElementById('suggestions');
input.addEventListener('input', () => {
  const val = input.value;
  const suggs = getSuggestions(val);
  if (suggs.length && val.trim().length >= 2) {
    suggestionsEl.innerHTML = suggs.map(n=>`<div class="suggestion-item" data-name="${n}">${highlight(n,val)}</div>`).join('');
    suggestionsEl.classList.add('open');
  } else { suggestionsEl.classList.remove('open'); }
  if (!val.trim()) document.getElementById('result').classList.remove('visible');
});
suggestionsEl.addEventListener('click', e => {
  const item = e.target.closest('.suggestion-item');
  if (!item) return;
  input.value = item.dataset.name;
  suggestionsEl.classList.remove('open');
  const g = findGuest(input.value);
  if (g) showResult(g);
});
input.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    suggestionsEl.classList.remove('open');
    const g = findGuest(input.value);
    if (g) showResult(g); else if (input.value.trim()) showNotFound(input.value.trim());
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrapper') && !e.target.closest('#suggestions'))
    suggestionsEl.classList.remove('open');
});
</script>
